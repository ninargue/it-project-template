name: Backport PR

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport a develop
    # Solo cuando una rama release/* o hotfix/* se mergea a master
    if: >
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sincronizar master hacia develop mediante PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BRANCH_NAME="chore/backport-${PR_NUMBER}-to-develop"
          echo "Creando rama $BRANCH_NAME desde origin/develop..."
          git checkout -b "$BRANCH_NAME" origin/develop

          echo "Incorporando master mediante merge de Git Flow..."
          git merge origin/master --no-edit -m "chore(backport): merge master into develop after PR #${PR_NUMBER}"

          echo "Pusheando rama $BRANCH_NAME a origin..."
          git push origin "$BRANCH_NAME"

          echo "Creando Pull Request hacia develop..."
          gh pr create \
            --base develop \
            --head "$BRANCH_NAME" \
            --title "[backport develop] ${PR_TITLE}" \
            --label "tipo:chore" \
            --body "Backport automático de los cambios de release/hotfix mergeados en master (PR #${PR_NUMBER}).

          **PR original:** #${PR_NUMBER} — ${PR_TITLE}
          
          Mantiene la paridad total del árbol de Git entre master y develop."
